<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="avgen">
  <title>avgen</title>
  <!-- Two outlined frames behind: a clip is a stack of frames in time. -->
  <g fill="none" stroke="#14161a" stroke-width="4.5" stroke-linejoin="round">
    <rect x="6"  y="6"  width="32" height="32" rx="7"/>
    <rect x="15" y="15" width="32" height="32" rx="7"/>
  </g>
  <!-- A gap in the background colour, so the front card reads as in front
       rather than merging with the frame behind it. -->
  <rect x="21" y="21" width="40" height="40" rx="11" fill="#ffffff"/>
  <!-- The front card holds the token sequence those frames collapse into. -->
  <rect x="24" y="24" width="34" height="34" rx="8" fill="#14161a"/>
  <g fill="#ffffff">
    <rect x="30" y="31" width="22" height="4.5" rx="2.25"/>
    <rect x="30" y="39" width="15" height="4.5" rx="2.25"/>
    <rect x="30" y="47" width="9"  height="4.5" rx="2.25"/>
  </g>
</svg>
