blank_issues_enabled: false
contact_links:
  - name: Question or usage help
    url: https://github.com/thesvj/avgen/discussions/categories/q-a
    about: >-
      "How do I ...", "which parallelism should I use", "is this expected" —
      ask in Discussions. Include your world size and parallelism degrees.
  - name: Show what you built
    url: https://github.com/thesvj/avgen/discussions/categories/show-and-tell
    about: Models, results, and configs trained with avgen.
  - name: Security vulnerability
    url: https://github.com/thesvj/avgen/security/advisories/new
    about: >-
      Report privately through GitHub Security Advisories. Never open a public
      issue for a security problem — see SECURITY.md.
  - name: Contributing guide
    url: https://github.com/thesvj/avgen/blob/main/CONTRIBUTING.md
    about: Dev setup, the test subsets, and how to extend avgen without forking.
