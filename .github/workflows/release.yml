name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_TORCH_BACKEND: cpu

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Read version from pyproject
        id: version
        run: |
          version=$(uv run --no-project python -c \
            "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $version"

      # A tag that disagrees with pyproject produces a release nobody can
      # reproduce from the source tree. Refuse it here, where it costs nothing.
      - name: Verify the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Verify the changelog has an entry for this version
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trusted publishing: PyPI mints a short-lived token from this workflow's
    # OIDC identity. No API token exists anywhere — not in a secret, not in a
    # maintainer's password manager, not in a leaked log. Configure the
    # publisher once at https://pypi.org/manage/project/avgen/settings/publishing/
    # for repository avgen-project/avgen, workflow release.yml, environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/p/avgen
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Deliberately no `password:` — that is the whole point.
          print-hash: true
          attestations: true

  github-release:
    name: attach artifacts to the GitHub release
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full list of changes." \
            --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
