# ---------------------------------------------------------------------------
# Nightly GPU and multi-GPU tests.
#
# The pull-request gate runs on CPU only, which means an entire class of change
# — anything touching NCCL, DTensor placement, fused kernels, bf16 numerics, or
# FSDP2's actual all-gather behaviour — lands untested until this job runs.
# That is a deliberate trade: a GPU runner on every PR would be slow and
# expensive. It is also why a red nightly must be treated as urgent.
#
# This workflow is written so that a fork, or this repository before a runner
# is registered, skips it cleanly instead of queueing a job forever. The
# preflight job asks GitHub whether a runner with the required labels is online
# and idle; if not, the GPU job is skipped and the run is green with an
# explanation in the summary. Do not "fix" a missing runner by removing the
# guard.
# ---------------------------------------------------------------------------

name: GPU nightly

on:
  schedule:
    # 03:30 UTC daily, well after the usual working day in every timezone the
    # maintainers are in, so a long run does not compete with interactive use
    # of the same machine.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      pytest_args:
        description: "Extra arguments passed to pytest"
        required: false
        default: ""

concurrency:
  # Never run two nightlies against the same physical GPUs.
  group: gpu-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: is a GPU runner available?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Required to list self-hosted runners. If a fork does not grant it, the
      # API call fails, the fallback marks the runner unavailable, and the GPU
      # job is skipped — which is the correct behaviour for a fork.
      administration: read
    outputs:
      runner-available: ${{ steps.check.outputs.available }}
    steps:
      - name: Query registered self-hosted runners
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          runners=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
            --jq '[.runners[] | select(.status == "online")
                   | select([.labels[].name] | index("gpu"))
                   | .name] | length' 2>/dev/null)
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ -z "$runners" ]; then
            echo "Could not list runners (no permission, or a fork). Skipping."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "online runners labelled 'gpu': $runners"
          if [ "$runners" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain a skip
        if: steps.check.outputs.available != 'true'
        run: |
          {
            echo "## GPU nightly skipped"
            echo
            echo "No online self-hosted runner labelled \`gpu\` is registered"
            echo "for \`${GITHUB_REPOSITORY}\`, so there is nothing to run on."
            echo
            echo "To enable it, register a runner with the labels"
            echo "\`self-hosted\`, \`linux\`, \`x64\`, \`gpu\` on a machine with"
            echo "at least two CUDA devices."
          } >> "$GITHUB_STEP_SUMMARY"

  gpu-tests:
    name: pytest -m "gpu or multigpu"
    needs: preflight
    if: needs.preflight.outputs.runner-available == 'true'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 180
    env:
      # Fail a hung collective in ten minutes rather than at the job timeout,
      # and dump the flight recorder so the hang is diagnosable afterwards.
      TORCH_NCCL_TRACE_BUFFER_SIZE: "2000"
      TORCH_NCCL_DUMP_ON_TIMEOUT: "1"
      TORCH_NCCL_DEBUG_INFO_TEMP_FILE: ${{ github.workspace }}/nccl_trace_rank_
      NCCL_DEBUG: WARN
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Report the hardware this ran on
        run: |
          nvidia-smi || true
          nvidia-smi topo -m || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      # No UV_TORCH_BACKEND here: this job wants the real CUDA wheel.
      - name: Install with every extra
        run: uv sync --all-extras --group dev

      - name: Sanity-check the device count
        run: |
          uv run python - <<'PY'
          import torch

          count = torch.cuda.device_count()
          print(f"visible CUDA devices: {count}")
          for index in range(count):
              print(" ", index, torch.cuda.get_device_name(index))
          if count < 1:
              raise SystemExit("runner is labelled 'gpu' but exposes no CUDA device")
          if count < 2:
              print("WARNING: fewer than two devices; multigpu tests will be skipped")
          PY

      - name: Single-GPU tests
        run: uv run pytest -m "gpu and not multigpu" -v ${{ github.event.inputs.pytest_args }}

      - name: Multi-GPU tests
        run: uv run pytest -m "multigpu" -v ${{ github.event.inputs.pytest_args }}

      - name: Upload NCCL flight-recorder dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nccl-flight-recorder
          path: nccl_trace_rank_*
          if-no-files-found: ignore
          retention-days: 14

      # A self-hosted runner keeps its working directory between jobs. Leaving
      # checkpoints and traces behind fills the disk within a week and the
      # failure that follows looks like something else entirely.
      - name: Clean up run artifacts
        if: always()
        run: |
          rm -rf runs outputs checkpoints .pytest_cache
          rm -f nccl_trace_rank_* || true
